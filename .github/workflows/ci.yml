name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install light dependencies (no model downloads)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            torch pymupdf python-docx python-pptx pandas openpyxl beautifulsoup4 pillow numpy
      - name: Unit tests
        run: python -m unittest discover tests -v
      - name: Syntax check for the app and scripts
        run: python -m py_compile app/streamlit_app.py scripts/*.py dlqa/*.py
